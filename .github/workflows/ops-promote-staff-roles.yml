name: Ops — Promote staff roles (production)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment database
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  promote:
    name: Promote user → qa_lead
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mysql2
        run: npm install mysql2@3.11.5

      - name: Promote legacy viewer users to qa_lead
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ops/promote-staff-to-qalead.mjs
