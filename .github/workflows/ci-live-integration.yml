# CI LIVE AI INTEGRATION WORKFLOW
# Phase 2.4 scaffold for live eval/drift gates.
#
# The contract job runs without secrets. The live DB job only runs live checks
# when DATABASE_URL is configured and remains non-blocking until trusted.

name: CI Live AI Integration

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly on Monday at 08:00 UTC
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  live-metrics-contract:
    name: Live Metrics CLI Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run liveMetrics CLI contract
        run: pnpm test -- server/tests/contracts/liveMetricsCli.contract.test.ts
        env:
          DATABASE_URL: ""

  live-eval-drift:
    name: Live Eval and Drift Gate
    runs-on: ubuntu-latest
    needs: live-metrics-contract
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EVAL_ENVIRONMENT: staging
      DRIFT_ENVIRONMENT: staging

    steps:
      - name: Check DATABASE_URL gate
        id: database-url-gate
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL is not configured; skipping live eval/drift checks."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.database-url-gate.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.database-url-gate.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: steps.database-url-gate.outputs.available == 'true'
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        if: steps.database-url-gate.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run live evaluation
        if: steps.database-url-gate.outputs.available == 'true'
        run: pnpm eval:run --mode fixtures --live

      - name: Run live drift detection
        if: steps.database-url-gate.outputs.available == 'true'
        run: pnpm drift:check --live

      - name: Upload live reports
        if: steps.database-url-gate.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-reports-${{ github.run_id }}
          path: |
            scripts/eval/reports/latest.json
            scripts/drift/reports/latest.json
          retention-days: 30
          if-no-files-found: ignore
